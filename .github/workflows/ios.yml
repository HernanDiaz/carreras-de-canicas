# Compila el juego para iOS en un Mac de GitHub y lo sube a TestFlight.
# Se lanza a mano: GitHub → Actions → "iOS (TestFlight)" → Run workflow.
#
# Secretos necesarios (Settings → Secrets and variables → Actions), ver README, sección iOS:
#   APPLE_TEAM_ID   ID de equipo de Apple Developer (10 caracteres)
#   ASC_KEY_ID      ID de la clave de API de App Store Connect
#   ASC_ISSUER_ID   ID del emisor (Issuer ID) de App Store Connect
#   ASC_KEY_P8      Contenido completo del archivo AuthKey_XXXX.p8
#
# La firma es automática: Xcode crea el certificado de distribución y el perfil con la
# clave de API, así que no hace falta un Mac propio ni tener iPhones registrados.
# Se compila sin firmar y se firma al exportar para App Store Connect.

name: iOS (TestFlight)

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  APP_NAME: CarrerasDeCanicas

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name (ver README, sección iOS)"
              missing=1
            fi
          done
          exit $missing

      # Godot 4.7 se compila con el SDK de iOS 26 (y Apple exige ese SDK para subir a la App Store),
      # así que hace falta Xcode 26 o posterior. Se elige el más nuevo que tenga la máquina.
      - name: Elegir Xcode
        run: |
          echo "Versiones de Xcode instaladas:"; ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::Esta máquina no tiene Xcode 26 o posterior (ver la lista de arriba)"
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      # Godot y sus plantillas (1,2 GB) se guardan en caché para no descargarlos en cada compilación.
      - name: Caché de Godot
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-ios

      - name: Descargar Godot y las plantillas de iOS
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/templates && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSLf -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSLf -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz "templates/ios.zip" "templates/version.txt" -d templates
          rm templates.tpz

      # Se guarda aunque luego falle la compilación, para no volver a descargarlo en el siguiente intento.
      - name: Guardar Godot en caché
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-ios

      - name: Instalar Godot
        run: |
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp ~/godot/templates/* "$dest/"
          echo "GODOT=$HOME/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      # Clasificaciones de Game Center: el plugin GameCenterKit (MIT) se compila aquí desde su
      # código fuente, en una versión fija, en vez de usar sus binarios ya hechos. No está en el
      # repositorio porque solo sirve en iOS (en el PC y en Android no hace falta).
      - name: Compilar el plugin de Game Center
        env:
          GCK_COMMIT: 65274996c3cb8a432947faed155713df94d2e5fe   # v1.0.1
          GODOT_CPP_COMMIT: e83fd0904c13356ed1d4c3d09f8bb9132bdc6b77
        run: |
          brew install scons
          mkdir -p ~/gck && cd ~/gck
          curl -sSLf "https://github.com/keremvatandas/godot-ios-gamecenter/archive/${GCK_COMMIT}.tar.gz" | tar xz --strip-components=1
          rm -rf godot-cpp && mkdir godot-cpp
          curl -sSLf "https://github.com/godotengine/godot-cpp/archive/${GODOT_CPP_COMMIT}.tar.gz" | tar xz --strip-components=1 -C godot-cpp
          scons platform=ios target=template_release arch=arm64 ios_min_version=14.0 -j"$(sysctl -n hw.ncpu)"
          # La biblioteca estática tiene que llevar dentro godot-cpp.
          xcrun libtool -static -o libgamecenter.a \
            build/libgamecenter.ios.template_release.arm64.a \
            godot-cpp/bin/libgodot-cpp.ios.template_release.arm64.a
          dest="$GITHUB_WORKSPACE/addons/gamecenter"
          mkdir -p "$dest/bin"
          cp example/addons/gamecenter/gamecenter.gdextension example/addons/gamecenter/plugin.cfg \
             example/addons/gamecenter/plugin.gd LICENSE "$dest/"
          xcodebuild -create-xcframework -library libgamecenter.a -output "$dest/bin/libgamecenter.ios.xcframework"
          # Activar su plugin de exportación, que enlaza GameKit en el proyecto de Xcode.
          cd "$GITHUB_WORKSPACE"
          sed -i '' 's|^enabled=PackedStringArray("res://addons/GodotPlayGameServices/plugin.cfg")$|enabled=PackedStringArray("res://addons/GodotPlayGameServices/plugin.cfg", "res://addons/gamecenter/plugin.cfg")|' project.godot
          grep -q "addons/gamecenter/plugin.cfg" project.godot

      - name: Generar el proyecto de Xcode
        run: |
          # El Team ID no se guarda en el repositorio: se pone aquí desde el secreto.
          sed -i '' "s/^application\/app_store_team_id=\"\"/application\/app_store_team_id=\"${APPLE_TEAM_ID}\"/" export_presets.cfg
          "$GODOT" --headless --path . --import || true
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" "build/ios/${APP_NAME}.ipa"
          test -d "build/ios/${APP_NAME}.xcodeproj"

      - name: Número de compilación
        # Cada subida a Apple necesita un número distinto: se usa el número de ejecución del workflow.
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" \
            "build/ios/${APP_NAME}/${APP_NAME}-Info.plist"

      - name: Clave de App Store Connect
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Sin firmar: firmar aquí exigiría un perfil de desarrollo y un iPhone registrado.
      # La firma de distribución se hace en el paso siguiente, al exportar.
      - name: Compilar
        run: |
          xcodebuild archive \
            -project "build/ios/${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/ios/${APP_NAME}.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # Al compilar sin firmar, los derechos (entitlements) del proyecto, como Game Center, no
      # quedan en el binario, y al exportar solo se conservan los que ya lleva. Por eso se firma
      # aquí el archivo con una firma local ("ad hoc") que los incluye; al exportar se sustituye
      # por la firma de distribución manteniendo los derechos.
      - name: Añadir los derechos (entitlements) al archivo
        run: |
          app=$(ls -d "build/ios/${APP_NAME}.xcarchive/Products/Applications/"*.app)
          ent=$(find "build/ios" -maxdepth 2 -name "*.entitlements" | head -1)
          if [ -z "$ent" ]; then
            echo "::error::Godot no ha generado el archivo .entitlements"
            exit 1
          fi
          echo "Derechos ($ent):"; cat "$ent"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.game-center" "$ent"
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) \
              -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none --entitlements "$ent" "$app"
          codesign -d --entitlements - "$app"

      # Primero se exporta el .ipa firmado y se comprueba que lleva Game Center (si no, Apple
      # no deja enviar la versión a revisión); solo entonces se sube.
      - name: Firmar y subir a TestFlight
        run: |
          for dest in export upload; do
          cat > ExportOptions-$dest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$dest</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          done
          export_archive() {
            xcodebuild -exportArchive \
              -archivePath "build/ios/${APP_NAME}.xcarchive" \
              -exportOptionsPlist "ExportOptions-$1.plist" \
              -exportPath "build/ios/$1" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          }
          export_archive export
          mkdir -p build/ios/check && unzip -q -o build/ios/export/*.ipa -d build/ios/check
          codesign -d --entitlements - build/ios/check/Payload/*.app 2>&1 | tee build/ios/check/ent.txt
          if ! grep -q "com.apple.developer.game-center" build/ios/check/ent.txt; then
            echo "::error::La app exportada no lleva el derecho de Game Center"
            exit 1
          fi
          export_archive upload
          echo "Subido. En unos minutos aparecerá en App Store Connect → TestFlight (compilación ${{ github.run_number }})."

      - name: Borrar la clave
        if: always()
        run: rm -rf ~/private_keys
